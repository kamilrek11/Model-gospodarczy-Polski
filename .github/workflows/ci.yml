name: CI

on:
  pull_request:
  push:
    branches: [main]
  # manual runs only: also the only trigger of the live-sources job (real network sources)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install pinned dependencies (runtime + dev)
        # The project is not an installable package: install the exact pins listed in pyproject.toml.
        run: |
          python -m venv .venv
          .venv/bin/pip install $(.venv/bin/python -c "import tomllib;p=tomllib.load(open('pyproject.toml','rb'))['project'];print(' '.join(p['dependencies']+p['optional-dependencies']['dev']))")
      - name: pytest (ResourceWarnings are errors via pyproject; live tests skipped via addopts)
        run: .venv/bin/python -m pytest -q

  live-sources:
    name: Live data sources (pytest -m live)
    # contacts GUS BDL, Eurostat and dane.gov.pl (~7 MB): manual runs only, never on PRs or pushes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install pinned dependencies (runtime + dev)
        run: |
          python -m venv .venv
          .venv/bin/pip install $(.venv/bin/python -c "import tomllib;p=tomllib.load(open('pyproject.toml','rb'))['project'];print(' '.join(p['dependencies']+p['optional-dependencies']['dev']))")
      - name: pytest -m live (real sources)
        env:
          BDL_CLIENT_ID: ${{ secrets.BDL_CLIENT_ID }}
        run: .venv/bin/python -m pytest -m live -q

  frontend:
    name: Frontend (vitest, tsc, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Backend venv (e2e scripts use backend/.venv)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install $(.venv/bin/python -c "import tomllib;print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Install Chromium for Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run e2e (builds the SPA, starts seeded/empty backends and preview servers)
        working-directory: e2e
        run: npm test
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results
          if-no-files-found: ignore

  docker:
    name: Docker (build, compose up, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 120
      - name: nginx configuration syntax
        run: docker compose exec -T frontend nginx -t
      - name: Smoke test through nginx (SPA + /api proxy strips the prefix)
        run: |
          curl -fsS http://localhost:8080/ | grep -qi "<div id=\"root\""
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/parameters | grep -q '"vat_rate_standard"'
          # deep link falls back to index.html, which must not be cached
          curl -fsSI http://localhost:8080/some/deep/link | grep -i "cache-control: no-cache"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
